# Required verification for pull requests and pushes to main.
#
# Every platform job runs the same CMake bootstrap developers run: there is no
# separate CI-only dependency path, and no preinstalled Qt or vcpkg is used.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Included when a merge queue is enabled.
  merge_group:
  # The release workflow runs this same matrix as its gate.
  workflow_call:

# Ordinary test jobs need read-only access. The coverage job asks for the one
# extra identity-token permission its upload needs, and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # File-backed vcpkg binary cache, restored and saved through actions/cache.
  VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite'
  VCPKG_DISABLE_METRICS: '1'
  CULLFINCH_VCPKG_CACHE: '${{ github.workspace }}/.vcpkg'
  # Single source of truth for the LLVM toolchain used by the clang-tidy and
  # sanitizer jobs. apt.llvm.org (Linux) and Homebrew's llvm@N formula
  # (macOS) release patch versions on their own, unsynchronised schedules --
  # in practice they are essentially never at the same point release at the
  # same time -- so each installation channel gets its own exact pin here,
  # sharing only the major version. The analysis jobs assert the installed
  # clang-tidy matches the pin for their own platform, so a channel that
  # silently moved to a new point release fails loudly instead of quietly
  # changing which diagnostics fire. Bump these when a new LLVM release
  # ships; the clang-format rev in .pre-commit-config.yaml tracks the same
  # major but, mirroring only tagged releases, will not always agree with
  # either channel on the patch digit.
  CULLFINCH_LLVM_MAJOR: '23'
  CULLFINCH_LLVM_VERSION_APT: '23.1.2'
  CULLFINCH_LLVM_VERSION_BREW: '23.1.0'
  # apt.llvm.org serves llvm.sh from a mutable path, and both LLVM install
  # steps below run it as root. These name the same script byte for byte --
  # verified identical to the apt.llvm.org copy -- at the commit that
  # produced it, so the content cannot change under us between runs.
  CULLFINCH_LLVM_SH_REPO: opencollab/llvm-jenkins.debian.net
  CULLFINCH_LLVM_SH_COMMIT: 6dc0d1ad7de83d0782731687fd555a7859b4da58
  CULLFINCH_LLVM_SH_SHA256: >-
    03878e08f47b66cc95bc4b544b0db3c6d9ce8d60e6cf2492ae357984330a9eae

jobs:
  pre-commit:
    name: Pre-commit checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # No --no-build on any uv invocation in this job, the `uv run` steps below
      # included: actionlint-py-kjanat's current release publishes no wheel,
      # `uv run` re-checks the environment against the lock on every call, and
      # uv has no per-package exemption from a global --no-build. The lock
      # pins that sdist by hash, which is what makes building it acceptable.
      # See issue #25.
      - name: Sync the locked tooling environment
        run: uv sync --locked --group tooling

      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ matrix.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Validate the hook configuration
        run: uv run --frozen --group tooling -- pre-commit validate-config

      # The same configuration developers commit with, against every tracked file.
      - name: Run all hooks on all files
        id: hooks
        run: uv run --frozen --group tooling -- pre-commit run --all-files --show-diff-on-failure

      # A formatting change is a failure with a downloadable diff. CI never
      # commits the fix itself.
      - name: Capture the formatting diff
        if: ${{ failure() && steps.hooks.outcome == 'failure' }}
        run: git diff > pre-commit.diff || true

      # The upload itself is `continue-on-error`, here and everywhere below:
      # these artifacts are evidence about a run, never a product of it, and an
      # artifact service that will not store them has said nothing about the
      # code under test.
      - name: Upload the formatting diff
        if: ${{ failure() && steps.hooks.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pre-commit-diff-${{ matrix.os }}
          path: pre-commit.diff
          if-no-files-found: ignore

  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native Wayland is the primary Linux backend, so the complete core
          # GUI suite and the package smoke run under a real compositor here.
          - name: Linux GCC / native Wayland
            runner: ubuntu-24.04
            preset: ci-linux-gcc
            display: wayland
            session: tests/support/with-wayland.sh
            package: true
            visual: true
          # Sanitizers cover the application, not the shipped artefact: the
          # package that ships is not instrumented, so a smoke test against a
          # sanitized binary would prove nothing about it.
          - name: Linux Clang sanitizers
            runner: ubuntu-24.04
            preset: ci-linux-asan
            display: wayland
            session: tests/support/with-wayland.sh
            package: false
            visual: false
          # Secondary compatibility: the XCB path must keep working, but it is
          # never a substitute for the Wayland job above.
          - name: Linux X11 compatibility
            runner: ubuntu-24.04
            preset: ci-linux-gcc-x11
            display: xcb
            session: tests/support/with-x11.sh
            package: true
            visual: false
          - name: macOS Apple Silicon
            runner: macos-15
            preset: ci-macos
            display: cocoa
            session: ''
            package: true
            visual: false
          - name: macOS Intel
            runner: macos-15-intel
            preset: ci-macos
            display: cocoa
            session: ''
            package: true
            visual: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install platform prerequisites (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/setup-linux.sh

      - name: Install platform prerequisites (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/setup-macos.sh

      # Ubuntu's own clang package tracks whatever major that release shipped
      # with, unrelated to the pinned LLVM the clang-tidy jobs use. Installing
      # from apt.llvm.org instead means the sanitized build and the analysis
      # jobs run the same compiler.
      - name: Install the pinned LLVM (Linux sanitizers job)
        if: matrix.preset == 'ci-linux-asan'
        run: |
          # --proto/--proto-redir pin the transport: -L follows redirects, and
          # without them a redirect to http:// would be honoured silently.
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/llvm.sh \
            "https://raw.githubusercontent.com/${CULLFINCH_LLVM_SH_REPO}/${CULLFINCH_LLVM_SH_COMMIT}/llvm.sh"
          # Nothing is executed until the digest matches. The step shell is
          # `bash -e`, so a mismatch fails here rather than reaching sudo. An
          # upstream change to the script is meant to fail this job: re-review
          # it, then move the commit and digest together.
          echo "${CULLFINCH_LLVM_SH_SHA256}  /tmp/llvm.sh" | sha256sum --check --strict -
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "${CULLFINCH_LLVM_MAJOR}"
          clang="$(command -v "clang-${CULLFINCH_LLVM_MAJOR}" || true)"
          clangxx="$(command -v "clang++-${CULLFINCH_LLVM_MAJOR}" || true)"
          if [ -z "${clang}" ] || [ -z "${clangxx}" ]; then
            echo "apt.llvm.org did not provide clang-${CULLFINCH_LLVM_MAJOR}/clang++-${CULLFINCH_LLVM_MAJOR}" >&2
            exit 1
          fi
          installed_version="$("${clang}" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          if [ "${installed_version}" != "${CULLFINCH_LLVM_VERSION_APT}" ]; then
            echo "clang-${CULLFINCH_LLVM_MAJOR} installed ${installed_version}, pinned to ${CULLFINCH_LLVM_VERSION_APT}; bump CULLFINCH_LLVM_VERSION_APT or investigate the runner image" >&2
            exit 1
          fi
          {
            echo "CC=${clang}"
            echo "CXX=${clangxx}"
          } >> "$GITHUB_ENV"

      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      # Cache keys cover the OS, architecture, compiler identity, the manifest
      # and baseline, and the triplets. vcpkg still validates ABI compatibility
      # internally; a complete CMake build tree is never restored.
      #
      # buildtrees, packages and downloads are excluded: they are intermediate
      # output, and on this project buildtrees alone is 9.8 GB against 68 MB for
      # the checkout itself. Caching them wholesale blew past GitHub's 10 GB
      # per-repository limit and made the entries evict each other. The binary
      # cache is the part worth keeping.
      - name: Restore the vcpkg dependency cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vcpkg
            !.vcpkg/*/buildtrees
            !.vcpkg/*/packages
            !.vcpkg/*/downloads
            .vcpkg-binary-cache
          key: >-
            vcpkg-${{ matrix.runner }}-${{ matrix.preset }}-${{
            hashFiles('vcpkg.json', 'cmake/triplets/*.cmake', 'cmake/BootstrapVcpkg.cmake') }}
          restore-keys: |
            vcpkg-${{ matrix.runner }}-${{ matrix.preset }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Record the resolved dependency inventory
        run: |
          find vcpkg_installed -name 'CONTROL' -o -name '*.list' | head -50 > deps-inventory.txt || true
          ls vcpkg_installed >> deps-inventory.txt || true

      - name: Run unit and integration tests
        run: ctest --preset ${{ matrix.preset }} --label-regex 'unit|integration' --output-junit
          "${{ github.workspace }}/ctest-nogui.xml"

      # The session helper owns its compositor, its D-Bus and its runtime
      # directory, waits for a real client connection, and makes the tests
      # assert the backend they actually got -- so an XWayland, XCB or
      # offscreen fallback fails the job instead of passing quietly.
      - name: Run GUI tests on the desktop backend
        env:
          QT_QPA_PLATFORM: ${{ matrix.display }}
          CULLFINCH_EXPECTED_PLATFORM: ${{ matrix.display }}
          CULLFINCH_ARTIFACT_DIR: ${{ github.workspace }}/session-artifacts
        run: |
          ${{ matrix.session }} ctest --preset ${{ matrix.preset }} --label-regex gui \
            --output-junit "${{ github.workspace }}/ctest-gui.xml"

      # Pixel comparisons need a backend that composes the same way every
      # time, so this suite pins QT_QPA_PLATFORM=offscreen itself rather than
      # inheriting the job's. It runs on the primary Linux job alone: a
      # reference set belongs to one rendering environment, and recording one
      # per runner image would cost more than it proves. Differences are
      # written to the directory the session helpers already publish.
      - name: Run visual regression tests
        if: matrix.visual
        env:
          CULLFINCH_ARTIFACT_DIR: ${{ github.workspace }}/session-artifacts
          # Without this, an environment whose digest is not recorded skips
          # every case and the job passes having compared nothing. A gating
          # job would rather be told: a runner image that changes its fonts
          # fails here instead of quietly retiring the suite.
          CULLFINCH_REQUIRE_VISUAL_REFERENCES: '1'
        run: |
          ctest --preset ${{ matrix.preset }} --label-regex visual \
            --output-junit "${{ github.workspace }}/ctest-visual.xml"

      - name: Install into a staging prefix
        if: matrix.package
        run: cmake --install build/${{ matrix.preset }} --prefix "${{ github.workspace }}/stage"

      # Linked unit tests cannot catch a missing runtime dependency; launching
      # the deployed package can. On Linux this runs with the native backend
      # selected and X11 genuinely unavailable, because a package that works
      # only through XCB does not satisfy the primary Linux target.
      - name: Packaged application smoke test
        if: matrix.package
        env:
          QT_QPA_PLATFORM: ${{ matrix.display }}
          # Names the backend the installed binary must actually load, which
          # the smoke test both selects and asserts.
          CULLFINCH_EXPECTED_PLATFORM: ${{ matrix.display }}
          CULLFINCH_ARTIFACT_DIR: ${{ github.workspace }}/session-artifacts
          # A plugin that is present but cannot be loaded fails with a bare
          # "Driver not loaded"; the loader's own diagnostics name the missing
          # library. The test shows the output only when the run fails.
          QT_DEBUG_PLUGINS: '1'
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            binary="${{ github.workspace }}/stage/cullfinch.app/Contents/MacOS/cullfinch"
          else
            binary="${{ github.workspace }}/stage/bin/cullfinch"
          fi
          echo "CULLFINCH_PACKAGED_BINARY=${binary}" >> "$GITHUB_ENV"
          CULLFINCH_PACKAGED_BINARY="${binary}" ${{ matrix.session }} \
            ctest --preset ${{ matrix.preset }} --label-regex package \
            --output-junit "${{ github.workspace }}/ctest-package.xml"

      # Which plugins actually reached the package is the whole point of the
      # smoke test, so the inventory is recorded either way -- a missing one is
      # far easier to see here than to infer from a runtime failure. On macOS
      # the load commands of the executable and of the SQL driver are recorded
      # too: whether a deployed plugin can be loaded depends on the names it
      # references and the paths it searches, which the file list cannot show.
      - name: Record the deployed plugin inventory
        if: always()
        run: |
          stage="${{ github.workspace }}/stage"
          {
            echo "# deployed plugins (${{ matrix.name }})"
            find "${stage}" \( -name '*.so' -o -name '*.dylib' \) -print 2>/dev/null \
              | sed "s|${stage}/||" | sort
            if [ "${{ runner.os }}" = "macOS" ]; then
              for binary in "${stage}/cullfinch.app/Contents/MacOS/cullfinch" \
                "${stage}"/cullfinch.app/Contents/PlugIns/sqldrivers/*.dylib; do
                [ -e "${binary}" ] || continue
                echo
                echo "## ${binary#"${stage}"/}"
                otool -L "${binary}"
                otool -l "${binary}" | grep -A 2 'LC_RPATH' || true
              done
            fi
          } > "plugins-${{ matrix.preset }}.txt"
          cat "plugins-${{ matrix.preset }}.txt"

      - name: Upload test results and failure artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ matrix.preset }}-${{ matrix.runner }}
          path: |
            ctest-*.xml
            deps-inventory.txt
            plugins-*.txt
            build/${{ matrix.preset }}/Testing/**
            build/${{ matrix.preset }}/clang-tidy-enabled-checks.txt
            session-artifacts/**
          if-no-files-found: ignore
          retention-days: 14

      # Saved even when a later step fails: building Qt from source costs about
      # forty minutes, and throwing it away because the application did not
      # compile would make every retry pay for it again.
      - name: Save the vcpkg dependency cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vcpkg
            !.vcpkg/*/buildtrees
            !.vcpkg/*/packages
            !.vcpkg/*/downloads
            .vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

  clang-tidy:
    name: CMake clang-tidy (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            preset: ci-tidy-linux
          - runner: macos-15
            preset: ci-tidy-macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install platform prerequisites (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/setup-linux.sh

      - name: Install platform prerequisites (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/setup-macos.sh

      # A matched upstream Clang/clang-tidy toolchain: the Apple toolchain does
      # not ship clang-tidy, and mixing versions changes the diagnostics.
      # ubuntu-24.04 ships clang-tidy 18, below the supported minimum, and the
      # version guard rightly refuses it. apt.llvm.org is the documented
      # provisioning path for a pinned toolchain; CULLFINCH_LLVM_MAJOR also
      # matches the clang-format hook and Homebrew's llvm@N on macOS, so the
      # same LLVM release line produces every diagnostic this project
      # enforces (the "Verify" step below checks the exact patch per
      # platform, since apt.llvm.org and Homebrew do not release in lockstep).
      - name: Install the pinned LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          # --proto/--proto-redir pin the transport: -L follows redirects, and
          # without them a redirect to http:// would be honoured silently.
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/llvm.sh \
            "https://raw.githubusercontent.com/${CULLFINCH_LLVM_SH_REPO}/${CULLFINCH_LLVM_SH_COMMIT}/llvm.sh"
          # Nothing is executed until the digest matches. The step shell is
          # `bash -e`, so a mismatch fails here rather than reaching sudo. An
          # upstream change to the script is meant to fail this job: re-review
          # it, then move the commit and digest together.
          echo "${CULLFINCH_LLVM_SH_SHA256}  /tmp/llvm.sh" | sha256sum --check --strict -
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "${CULLFINCH_LLVM_MAJOR}"
          # llvm.sh installs clang, lldb, lld and clangd, but clang-tidy ships
          # in its own package that the script does not pull in.
          sudo apt-get install --no-install-recommends -y \
            "clang-tidy-${CULLFINCH_LLVM_MAJOR}"
          tidy="$(command -v "clang-tidy-${CULLFINCH_LLVM_MAJOR}" || true)"
          if [ -z "${tidy}" ]; then
            echo "apt.llvm.org did not provide clang-tidy-${CULLFINCH_LLVM_MAJOR}" >&2
            exit 1
          fi
          "${tidy}" --version
          {
            echo "CULLFINCH_CLANG_TIDY_EXECUTABLE=${tidy}"
            echo "CC=clang-${CULLFINCH_LLVM_MAJOR}"
            echo "CXX=clang++-${CULLFINCH_LLVM_MAJOR}"
          } >> "$GITHUB_ENV"

      # No fallback to the unversioned `llvm` formula: if Homebrew no longer
      # carries this exact major, the job should fail loudly rather than
      # silently analyse with a different LLVM release.
      - name: Locate the pinned LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          prefix="$(brew --prefix "llvm@${CULLFINCH_LLVM_MAJOR}")"
          echo "CULLFINCH_CLANG_TIDY_EXECUTABLE=${prefix}/bin/clang-tidy" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      # Dependency binaries are reused; a precompiled application build tree is
      # not, because an up-to-date build would perform no analysis at all.
      - name: Restore the vcpkg dependency cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vcpkg
            !.vcpkg/*/buildtrees
            !.vcpkg/*/packages
            !.vcpkg/*/downloads
            .vcpkg-binary-cache
          key: >-
            vcpkg-${{ matrix.runner }}-${{ matrix.preset }}-${{
            hashFiles('vcpkg.json', 'cmake/triplets/*.cmake', 'cmake/BootstrapVcpkg.cmake') }}
          restore-keys: |
            vcpkg-${{ matrix.runner }}-

      - name: Configure a fresh analysis build
        run: |
          rm -rf "build/${{ matrix.preset }}"
          cmake --preset ${{ matrix.preset }} \
            -DCULLFINCH_CLANG_TIDY_EXECUTABLE="${CULLFINCH_CLANG_TIDY_EXECUTABLE}"

      # Enabled diagnostics are errors, so a finding fails the build.
      - name: Analyse every owned translation unit
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Verify the analysis actually ran
        run: |
          checks="build/${{ matrix.preset }}/clang-tidy-enabled-checks.txt"
          test -s "${checks}" || {
            echo "clang-tidy produced no enabled-check list; the analysis did not run" >&2
            exit 1
          }
          wc -l "${checks}"

          # Asserted here, not just at install time: a silently upgraded
          # runner image must fail the job, not just log a stale version
          # string from before the toolchain drifted. apt.llvm.org and
          # Homebrew release on their own schedules, so each platform is
          # checked against its own pin.
          if [ "${{ runner.os }}" = "macOS" ]; then
            expected="${CULLFINCH_LLVM_VERSION_BREW}"
          else
            expected="${CULLFINCH_LLVM_VERSION_APT}"
          fi
          installed_version="$("${CULLFINCH_CLANG_TIDY_EXECUTABLE}" --version \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          if [ "${installed_version}" != "${expected}" ]; then
            echo "clang-tidy reports ${installed_version}, but the pin for this platform is ${expected}" >&2
            exit 1
          fi
          echo "clang-tidy ${installed_version} matches the pin"

      - name: Upload the enabled-check inventory
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clang-tidy-checks-${{ matrix.runner }}
          path: build/${{ matrix.preset }}/clang-tidy-enabled-checks.txt
          if-no-files-found: warn

      # Saved even when a later step fails: building Qt from source costs about
      # forty minutes, and throwing it away because the application did not
      # compile would make every retry pay for it again.
      - name: Save the vcpkg dependency cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vcpkg
            !.vcpkg/*/buildtrees
            !.vcpkg/*/packages
            !.vcpkg/*/downloads
            .vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

  coverage:
    name: Coverage and Codecov
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      # Only this job gets the identity token its upload authentication needs.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install platform prerequisites
        run: ./scripts/setup-linux.sh

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # No --no-build: actionlint-py-kjanat's current release publishes no
      # wheel, so the sync has to build its source distribution. The lock
      # pins that sdist by hash, which is what makes building it acceptable.
      # See issue #25.
      - name: Sync the locked tooling environment
        run: uv sync --locked --group tooling

      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      - name: Restore the vcpkg dependency cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vcpkg
            !.vcpkg/*/buildtrees
            !.vcpkg/*/packages
            !.vcpkg/*/downloads
            .vcpkg-binary-cache
          key: >-
            vcpkg-ubuntu-24.04-coverage-${{
            hashFiles('vcpkg.json', 'cmake/triplets/*.cmake', 'cmake/BootstrapVcpkg.cmake') }}
          restore-keys: |
            vcpkg-ubuntu-24.04-

      # A clean application coverage directory, while compatible dependency
      # binaries are still reused.
      - name: Configure the coverage build
        run: |
          rm -rf build/coverage
          cmake --preset coverage

      - name: Build with coverage instrumentation
        run: cmake --build --preset coverage

      # The same isolated native Wayland session helper the required GUI job
      # uses, so the coverage report reflects the backend that actually ships.
      # Serial execution: concurrent processes writing counters for the same
      # instrumented libraries would corrupt the measurement.
      - name: Run the unit, integration and GUI suites
        env:
          CULLFINCH_ARTIFACT_DIR: ${{ github.workspace }}/session-artifacts
        run: |
          tests/support/with-wayland.sh ctest --preset coverage \
            --output-junit "${{ github.workspace }}/ctest-coverage.xml"

      - name: Require all three suites to have executed
        run: |
          for label in unit integration gui; do
            count=$(ctest --preset coverage --label-regex "${label}" --show-only=json-v1 \
              | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["tests"]))')
            if [ "${count}" -eq 0 ]; then
              echo "the ${label} suite discovered no tests" >&2
              exit 1
            fi
            echo "${label}: ${count} tests"
          done

      - name: Generate the Cobertura and HTML reports
        run: cmake --build --preset coverage --target coverage-report

      # A report that does not actually contain owned source is not a report.
      - name: Validate the coverage report
        run: python3 scripts/validate_coverage_report.py build/coverage/coverage/coverage.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: build/coverage/coverage/coverage.xml
          disable_search: true
          # One combined report for all three suites under a single stable flag.
          flags: linux-gcc
          name: linux-gcc-combined
          use_oidc: true
          fail_ci_if_error: true

      - name: Upload the coverage artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-linux-gcc
          path: |
            build/coverage/coverage/coverage.xml
            build/coverage/coverage/html/**
            ctest-coverage.xml
            session-artifacts/**
          if-no-files-found: warn
          retention-days: 14

      # Saved even when a later step fails: building Qt from source costs about
      # forty minutes, and throwing it away because the application did not
      # compile would make every retry pay for it again.
      - name: Save the vcpkg dependency cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vcpkg
            !.vcpkg/*/buildtrees
            !.vcpkg/*/packages
            !.vcpkg/*/downloads
            .vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

  required:
    name: Required checks
    if: always()
    needs: [pre-commit, build-and-test, clang-tidy, coverage]
    runs-on: ubuntu-24.04
    steps:
      # A single stable status for branch protection: it fails unless every
      # required job succeeded, including when one was skipped or cancelled.
      - name: Verify every required job succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: ${results}"
          for result in ${results}; do
            if [ "${result}" != "success" ]; then
              echo "a required job did not succeed" >&2
              exit 1
            fi
          done
          echo "all required jobs succeeded"
