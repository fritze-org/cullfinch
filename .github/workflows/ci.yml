# Required verification for pull requests and pushes to main.
#
# Every platform job runs the same CMake bootstrap developers run: there is no
# separate CI-only dependency path, and no preinstalled Qt or vcpkg is used.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Included when a merge queue is enabled.
  merge_group:
  # The release workflow runs this same matrix as its gate.
  workflow_call:

# Ordinary test jobs need read-only access. The coverage job asks for the one
# extra identity-token permission its upload needs, and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # File-backed vcpkg binary cache, restored and saved through actions/cache.
  VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite'
  VCPKG_DISABLE_METRICS: '1'
  CULLFINCH_VCPKG_CACHE: '${{ github.workspace }}/.vcpkg'

jobs:
  pre-commit:
    name: Pre-commit checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync the locked tooling environment
        run: uv sync --locked --group tooling

      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ matrix.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Validate the hook configuration
        run: uv run --frozen --group tooling -- pre-commit validate-config

      # The same configuration developers commit with, against every tracked file.
      - name: Run all hooks on all files
        id: hooks
        run: uv run --frozen --group tooling -- pre-commit run --all-files --show-diff-on-failure

      # A formatting change is a failure with a downloadable diff. CI never
      # commits the fix itself.
      - name: Capture the formatting diff
        if: ${{ failure() && steps.hooks.outcome == 'failure' }}
        run: git diff > pre-commit.diff || true

      - name: Upload the formatting diff
        if: ${{ failure() && steps.hooks.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pre-commit-diff-${{ matrix.os }}
          path: pre-commit.diff
          if-no-files-found: ignore

  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native Wayland is the primary Linux backend, so the complete core
          # GUI suite and the package smoke run under a real compositor here.
          - name: Linux GCC / native Wayland
            runner: ubuntu-24.04
            preset: ci-linux-gcc
            display: wayland
            session: tests/support/with-wayland.sh
          - name: Linux Clang sanitizers
            runner: ubuntu-24.04
            preset: ci-linux-asan
            display: wayland
            session: tests/support/with-wayland.sh
          # Secondary compatibility: the XCB path must keep working, but it is
          # never a substitute for the Wayland job above.
          - name: Linux X11 compatibility
            runner: ubuntu-24.04
            preset: ci-linux-gcc-x11
            display: xcb
            session: tests/support/with-x11.sh
          - name: macOS Apple Silicon
            runner: macos-15
            preset: ci-macos
            display: cocoa
            session: ''
          - name: macOS Intel
            runner: macos-15-intel
            preset: ci-macos
            display: cocoa
            session: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install platform prerequisites (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/setup-linux.sh

      - name: Install platform prerequisites (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/setup-macos.sh

      - name: Install Clang (Linux sanitizers job)
        if: matrix.preset == 'ci-linux-asan'
        run: sudo apt-get install --no-install-recommends -y clang lld

      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      # Cache keys cover the OS, architecture, compiler identity, the manifest
      # and baseline, and the triplets. vcpkg still validates ABI compatibility
      # internally; a complete CMake build tree is never restored.
      #
      # buildtrees, packages and downloads are excluded: they are intermediate
      # output, and on this project buildtrees alone is 9.8 GB against 68 MB for
      # the checkout itself. Caching them wholesale blew past GitHub's 10 GB
      # per-repository limit and made the entries evict each other. The binary
      # cache is the part worth keeping.
      - name: Restore the vcpkg dependency cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vcpkg
            !.vcpkg/*/buildtrees
            !.vcpkg/*/packages
            !.vcpkg/*/downloads
            .vcpkg-binary-cache
          key: >-
            vcpkg-${{ matrix.runner }}-${{ matrix.preset }}-${{
            hashFiles('vcpkg.json', 'cmake/triplets/*.cmake', 'cmake/BootstrapVcpkg.cmake') }}
          restore-keys: |
            vcpkg-${{ matrix.runner }}-${{ matrix.preset }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Record the resolved dependency inventory
        run: |
          find vcpkg_installed -name 'CONTROL' -o -name '*.list' | head -50 > deps-inventory.txt || true
          ls vcpkg_installed >> deps-inventory.txt || true

      - name: Run unit and integration tests
        run: ctest --preset ${{ matrix.preset }} --label-regex 'unit|integration' --output-junit
          "${{ github.workspace }}/ctest-nogui.xml"

      # The session helper owns its compositor, its D-Bus and its runtime
      # directory, waits for a real client connection, and makes the tests
      # assert the backend they actually got -- so an XWayland, XCB or
      # offscreen fallback fails the job instead of passing quietly.
      - name: Run GUI tests on the desktop backend
        env:
          QT_QPA_PLATFORM: ${{ matrix.display }}
          CULLFINCH_EXPECTED_PLATFORM: ${{ matrix.display }}
          CULLFINCH_ARTIFACT_DIR: ${{ github.workspace }}/session-artifacts
        run: |
          ${{ matrix.session }} ctest --preset ${{ matrix.preset }} --label-regex gui \
            --output-junit "${{ github.workspace }}/ctest-gui.xml"

      - name: Install into a staging prefix
        run: cmake --install build/${{ matrix.preset }} --prefix "${{ github.workspace }}/stage"

      # Linked unit tests cannot catch a missing runtime dependency; launching
      # the deployed package can. On Linux this runs with the native backend
      # selected and X11 genuinely unavailable, because a package that works
      # only through XCB does not satisfy the primary Linux target.
      - name: Packaged application smoke test
        env:
          QT_QPA_PLATFORM: ${{ matrix.display }}
          # Names the backend the installed binary must actually load, which
          # the smoke test both selects and asserts.
          CULLFINCH_EXPECTED_PLATFORM: ${{ matrix.display }}
          CULLFINCH_ARTIFACT_DIR: ${{ github.workspace }}/session-artifacts
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            binary="${{ github.workspace }}/stage/cullfinch.app/Contents/MacOS/cullfinch"
          else
            binary="${{ github.workspace }}/stage/bin/cullfinch"
          fi
          echo "CULLFINCH_PACKAGED_BINARY=${binary}" >> "$GITHUB_ENV"
          CULLFINCH_PACKAGED_BINARY="${binary}" ${{ matrix.session }} \
            ctest --preset ${{ matrix.preset }} --label-regex package \
            --output-junit "${{ github.workspace }}/ctest-package.xml"

      # Which plugins actually reached the package is the whole point of the
      # smoke test, so the inventory is recorded either way -- a missing one is
      # far easier to see here than to infer from a runtime failure.
      - name: Record the deployed plugin inventory
        if: always()
        run: |
          {
            echo "# deployed plugins (${{ matrix.name }})"
            find "${{ github.workspace }}/stage" \
              \( -name '*.so' -o -name '*.dylib' \) -print 2>/dev/null \
              | sed "s|${{ github.workspace }}/stage/||" | sort
          } > "plugins-${{ matrix.preset }}.txt"
          cat "plugins-${{ matrix.preset }}.txt"

      - name: Upload test results and failure artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ matrix.preset }}-${{ matrix.runner }}
          path: |
            ctest-*.xml
            deps-inventory.txt
            plugins-*.txt
            build/${{ matrix.preset }}/Testing/**
            build/${{ matrix.preset }}/clang-tidy-enabled-checks.txt
            session-artifacts/**
          if-no-files-found: ignore
          retention-days: 14

      # Saved even when a later step fails: building Qt from source costs about
      # forty minutes, and throwing it away because the application did not
      # compile would make every retry pay for it again.
      - name: Save the vcpkg dependency cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vcpkg
            !.vcpkg/*/buildtrees
            !.vcpkg/*/packages
            !.vcpkg/*/downloads
            .vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

  clang-tidy:
    name: CMake clang-tidy (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            preset: ci-tidy-linux
          - runner: macos-15
            preset: ci-tidy-macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install platform prerequisites (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/setup-linux.sh

      - name: Install platform prerequisites (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/setup-macos.sh

      # A matched upstream Clang/clang-tidy toolchain: the Apple toolchain does
      # not ship clang-tidy, and mixing versions changes the diagnostics.
      # ubuntu-24.04 ships clang-tidy 18, below the supported minimum, and the
      # version guard rightly refuses it. apt.llvm.org is the documented
      # provisioning path for a pinned toolchain; 23 matches both the
      # clang-format hook and Homebrew's llvm@23 on macOS, so one LLVM version
      # produces every diagnostic this project enforces.
      - name: Install the pinned LLVM (Linux)
        if: runner.os == 'Linux'
        env:
          CULLFINCH_LLVM_VERSION: '23'
        run: |
          curl -fsSL -o /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "${CULLFINCH_LLVM_VERSION}"
          # llvm.sh installs clang, lldb, lld and clangd, but clang-tidy ships
          # in its own package that the script does not pull in.
          sudo apt-get install --no-install-recommends -y \
            "clang-tidy-${CULLFINCH_LLVM_VERSION}"
          tidy="$(command -v "clang-tidy-${CULLFINCH_LLVM_VERSION}" || true)"
          if [ -z "${tidy}" ]; then
            echo "apt.llvm.org did not provide clang-tidy-${CULLFINCH_LLVM_VERSION}" >&2
            exit 1
          fi
          "${tidy}" --version
          {
            echo "CULLFINCH_CLANG_TIDY_EXECUTABLE=${tidy}"
            echo "CC=clang-${CULLFINCH_LLVM_VERSION}"
            echo "CXX=clang++-${CULLFINCH_LLVM_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Locate the pinned LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          prefix="$(brew --prefix llvm@23 2>/dev/null || brew --prefix llvm)"
          echo "CULLFINCH_CLANG_TIDY_EXECUTABLE=${prefix}/bin/clang-tidy" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      # Dependency binaries are reused; a precompiled application build tree is
      # not, because an up-to-date build would perform no analysis at all.
      - name: Restore the vcpkg dependency cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vcpkg
            !.vcpkg/*/buildtrees
            !.vcpkg/*/packages
            !.vcpkg/*/downloads
            .vcpkg-binary-cache
          key: >-
            vcpkg-${{ matrix.runner }}-${{ matrix.preset }}-${{
            hashFiles('vcpkg.json', 'cmake/triplets/*.cmake', 'cmake/BootstrapVcpkg.cmake') }}
          restore-keys: |
            vcpkg-${{ matrix.runner }}-

      - name: Configure a fresh analysis build
        run: |
          rm -rf "build/${{ matrix.preset }}"
          cmake --preset ${{ matrix.preset }} \
            -DCULLFINCH_CLANG_TIDY_EXECUTABLE="${CULLFINCH_CLANG_TIDY_EXECUTABLE}"

      # Enabled diagnostics are errors, so a finding fails the build.
      - name: Analyse every owned translation unit
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Verify the analysis actually ran
        run: |
          checks="build/${{ matrix.preset }}/clang-tidy-enabled-checks.txt"
          test -s "${checks}" || {
            echo "clang-tidy produced no enabled-check list; the analysis did not run" >&2
            exit 1
          }
          wc -l "${checks}"

      - name: Upload the enabled-check inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clang-tidy-checks-${{ matrix.runner }}
          path: build/${{ matrix.preset }}/clang-tidy-enabled-checks.txt
          if-no-files-found: warn

      # Saved even when a later step fails: building Qt from source costs about
      # forty minutes, and throwing it away because the application did not
      # compile would make every retry pay for it again.
      - name: Save the vcpkg dependency cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vcpkg
            !.vcpkg/*/buildtrees
            !.vcpkg/*/packages
            !.vcpkg/*/downloads
            .vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

  coverage:
    name: Coverage and Codecov
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      # Only this job gets the identity token its upload authentication needs.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install platform prerequisites
        run: ./scripts/setup-linux.sh

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync the locked tooling environment
        run: uv sync --locked --group tooling

      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      - name: Restore the vcpkg dependency cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vcpkg
            !.vcpkg/*/buildtrees
            !.vcpkg/*/packages
            !.vcpkg/*/downloads
            .vcpkg-binary-cache
          key: >-
            vcpkg-ubuntu-24.04-coverage-${{
            hashFiles('vcpkg.json', 'cmake/triplets/*.cmake', 'cmake/BootstrapVcpkg.cmake') }}
          restore-keys: |
            vcpkg-ubuntu-24.04-

      # A clean application coverage directory, while compatible dependency
      # binaries are still reused.
      - name: Configure the coverage build
        run: |
          rm -rf build/coverage
          cmake --preset coverage

      - name: Build with coverage instrumentation
        run: cmake --build --preset coverage

      # The same isolated native Wayland session helper the required GUI job
      # uses, so the coverage report reflects the backend that actually ships.
      # Serial execution: concurrent processes writing counters for the same
      # instrumented libraries would corrupt the measurement.
      - name: Run the unit, integration and GUI suites
        env:
          CULLFINCH_ARTIFACT_DIR: ${{ github.workspace }}/session-artifacts
        run: |
          tests/support/with-wayland.sh ctest --preset coverage \
            --output-junit "${{ github.workspace }}/ctest-coverage.xml"

      - name: Require all three suites to have executed
        run: |
          for label in unit integration gui; do
            count=$(ctest --preset coverage --label-regex "${label}" --show-only=json-v1 \
              | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["tests"]))')
            if [ "${count}" -eq 0 ]; then
              echo "the ${label} suite discovered no tests" >&2
              exit 1
            fi
            echo "${label}: ${count} tests"
          done

      - name: Generate the Cobertura and HTML reports
        run: cmake --build --preset coverage --target coverage-report

      # A report that does not actually contain owned source is not a report.
      - name: Validate the coverage report
        run: python3 scripts/validate_coverage_report.py build/coverage/coverage/coverage.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: build/coverage/coverage/coverage.xml
          disable_search: true
          # One combined report for all three suites under a single stable flag.
          flags: linux-gcc
          name: linux-gcc-combined
          use_oidc: true
          fail_ci_if_error: true

      - name: Upload the coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-linux-gcc
          path: |
            build/coverage/coverage/coverage.xml
            build/coverage/coverage/html/**
            ctest-coverage.xml
            session-artifacts/**
          if-no-files-found: warn
          retention-days: 14

      # Saved even when a later step fails: building Qt from source costs about
      # forty minutes, and throwing it away because the application did not
      # compile would make every retry pay for it again.
      - name: Save the vcpkg dependency cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vcpkg
            !.vcpkg/*/buildtrees
            !.vcpkg/*/packages
            !.vcpkg/*/downloads
            .vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

  required:
    name: Required checks
    if: always()
    needs: [pre-commit, build-and-test, clang-tidy, coverage]
    runs-on: ubuntu-24.04
    steps:
      # A single stable status for branch protection: it fails unless every
      # required job succeeded, including when one was skipped or cancelled.
      - name: Verify every required job succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: ${results}"
          for result in ${results}; do
            if [ "${result}" != "success" ]; then
              echo "a required job did not succeed" >&2
              exit 1
            fi
          done
          echo "all required jobs succeeded"
