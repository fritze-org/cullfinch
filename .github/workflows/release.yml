# Tag-triggered package verification and release.
#
# A source build must never require signing credentials; whether a release is
# signed is recorded in its notes.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build
        required: true
        type: string

permissions:
  contents: read

env:
  VCPKG_DISABLE_METRICS: '1'
  CULLFINCH_VCPKG_CACHE: '${{ github.workspace }}/.vcpkg'

jobs:
  gate:
    name: Release gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write

  package:
    name: Package ${{ matrix.label }}
    needs: gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-24.04
          - label: macos-arm64
            runner: macos-15
          - label: macos-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install platform prerequisites (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/setup-linux.sh

      - name: Install platform prerequisites (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/setup-macos.sh

      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      - name: Configure and build the release preset
        run: |
          cmake --preset release
          cmake --build --preset release

      - name: Install into the package staging prefix
        run: cmake --install build/release --prefix "${{ github.workspace }}/stage"

      # Launching the deployed package is what catches a missing runtime
      # dependency; a linked test cannot. On Linux the gate runs the installed
      # binary under native Wayland with X11 unavailable and asserts which
      # platform plugin loaded: a package that works only through XCB or
      # offscreen does not satisfy the primary Linux target and must not ship.
      - name: Packaged application gate
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'macOS' && 'cocoa' || 'wayland' }}
          CULLFINCH_EXPECTED_PLATFORM: ${{ runner.os == 'macOS' && 'cocoa' || 'wayland' }}
          CULLFINCH_ARTIFACT_DIR: ${{ github.workspace }}/session-artifacts
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            binary="${{ github.workspace }}/stage/cullfinch.app/Contents/MacOS/cullfinch"
            session=""
          else
            binary="${{ github.workspace }}/stage/bin/cullfinch"
            session="tests/support/with-wayland.sh"
          fi
          CULLFINCH_PACKAGED_BINARY="${binary}" ${session} \
            ctest --preset release --label-regex package --output-on-failure

      - name: Record the dependency and licence inventory
        run: |
          {
            echo "# cullfinch ${{ matrix.label }} dependency inventory"
            echo
            echo "vcpkg baseline: $(python3 -c 'import json;print(json.load(open("vcpkg.json"))["builtin-baseline"])')"
            echo
            echo "## Installed packages"
            ls -1 vcpkg_installed/*/share 2>/dev/null || true
          } > "inventory-${{ matrix.label }}.md"

          find vcpkg_installed -name 'copyright' -print0 2>/dev/null \
            | xargs -0 -I{} sh -c 'echo "===== {} ====="; cat "{}"' \
            > "licences-${{ matrix.label }}.txt" || true

      - name: Build an AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          # An existing packaging tool; cullfinch does not implement an image
          # packager of its own. A released version, not the rolling
          # "continuous" asset, so two builds of the same tag use the same
          # packager -- and verified by digest, because a release asset can be
          # replaced after the fact.
          CULLFINCH_APPIMAGETOOL_VERSION: '1.9.1'
          CULLFINCH_APPIMAGETOOL_SHA256: >-
            ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          # --proto/--proto-redir pin the transport: -L follows redirects, and
          # the release asset is served through one, so without them a redirect
          # to http:// would be honoured silently.
          curl -fsSL --proto '=https' --proto-redir '=https' -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${CULLFINCH_APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          # Nothing is made executable until the digest matches. The step shell
          # is `bash -e`, so a mismatch fails here rather than packaging with an
          # unverified tool. Bump the version and the digest together.
          echo "${CULLFINCH_APPIMAGETOOL_SHA256}  appimagetool" | sha256sum --check --strict -
          chmod +x appimagetool

          appdir="${{ github.workspace }}/cullfinch.AppDir"
          mkdir -p "${appdir}"
          cp -a "${{ github.workspace }}/stage/." "${appdir}/"
          cp packaging/linux/org.fritze.cullfinch.desktop "${appdir}/"
          ln -sf usr/bin/cullfinch "${appdir}/AppRun" 2>/dev/null \
            || ln -sf bin/cullfinch "${appdir}/AppRun"

          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "${appdir}" \
            "cullfinch-${{ matrix.label }}.AppImage"

      - name: Build a disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname cullfinch -srcfolder "${{ github.workspace }}/stage" \
            -ov -format UDZO "cullfinch-${{ matrix.label }}.dmg"
          # Signing and notarisation are release concerns that need credentials
          # this workflow deliberately does not require.
          echo "signed=false" >> "$GITHUB_OUTPUT"

      - name: Create the unpacked install archive
        run: tar -C "${{ github.workspace }}/stage" -czf "cullfinch-${{ matrix.label }}.tar.gz" .

      - name: Generate checksums
        run: |
          for artefact in cullfinch-${{ matrix.label }}.*; do
            case "${artefact}" in
              *.sha256) continue ;;
            esac
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${artefact}" > "${artefact}.sha256"
            else
              shasum -a 256 "${artefact}" > "${artefact}.sha256"
            fi
          done

      - name: Upload the release artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.label }}
          path: |
            cullfinch-${{ matrix.label }}.*
            inventory-${{ matrix.label }}.md
            licences-${{ matrix.label }}.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish the release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect the packaged artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artefacts
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          files: artefacts/**
          body: |
            Built from the release preset with the pinned vcpkg baseline.

            macOS builds in this release are **not** signed or notarised: the
            source build deliberately does not require those credentials.
            Verify the published checksums before use.
