# Coverage scope for cullfinch. Owned application sources only: dependency,
# generated and test-implementation code stay out of the measured denominator.
filter = src/
exclude = .*/tests/.*
exclude = .*_autogen/.*
exclude = .*/moc_.*
exclude = .*/qrc_.*
exclude = .*/ui_.*
exclude = .*/\.vcpkg/.*
exclude = .*/vcpkg_installed/.*

exclude-unreachable-branches = yes
exclude-throw-branches = yes
exclude-noncode-lines = yes

print-summary = yes
sort = uncovered-percent
