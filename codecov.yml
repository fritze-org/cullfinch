codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: '60...90'
  status:
    project:
      default:
        # No regression against the base commit.
        target: auto
        threshold: 0%
        flags:
          - linux-gcc
    patch:
      default:
        # Proposed gate on changed executable lines; not an observed result.
        target: 90%
        threshold: 0%
        if_ci_failed: error
        flags:
          - linux-gcc

flags:
  linux-gcc:
    paths:
      - src/
    carryforward: false

comment:
  layout: 'reach, diff, flags, files'
  behavior: default
  require_changes: false

ignore:
  - 'tests/**'
  - 'docs/**'
  - 'packaging/**'
  - '**/*_autogen/**'
