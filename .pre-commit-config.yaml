# Comprehensive commit checks for cullfinch (R13).
#
# Commit hooks operate on staged files; the required CI job runs this same
# configuration against all tracked files. Formatting hooks fix files locally
# and the developer reviews and stages the result; in CI any modification is a
# failure with a downloadable diff. CI never commits formatting changes.
#
# Onboarding:
#   uv sync --locked --group tooling
#   uv run --frozen --group tooling pre-commit install --install-hooks
#   uv run --frozen --group tooling pre-commit run --all-files
minimum_pre_commit_version: '4.0.0'
default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

exclude: |
  (?x)^(
      tests/fixtures/.*|
      docs/design\.md|
      .*\.lock
  )$

repos:
  # ---------------------------------------------------------------- C++ format
  # Keep this rev in sync with CULLFINCH_LLVM_VERSION in
  # .github/workflows/ci.yml, the single source of truth for the LLVM release
  # this project's clang-tidy and sanitizer jobs are pinned to.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: e2b496dc2bd8340c2524cb9a2d2a943cde1bb6df  # frozen: v23.1.1
    hooks:
      - id: clang-format
        name: clang-format (LLVM 23)
        types_or: [c, c++]
        args: [--style=file]

  # ------------------------------------------------------------ editor settings
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: e8b4e28241a9ae8296ba6e4a491b5da4eda73283  # frozen: 3.11.1
    hooks:
      - id: editorconfig-checker
        alias: ec
        # The managed wrapper, never an arbitrary system binary.
        exclude: |
          (?x)^(
              tests/fixtures/.*|
              uv\.lock
          )$

  # --------------------------------------------------------------------- CMake
  # cheshirekow/cmake_format publishes the tools but no .pre-commit-hooks.yaml,
  # so the pinned `cmakelang` from the uv tooling group supplies them instead.
  # That is the same upstream implementation, pinned by uv.lock rather than by a
  # hook repository. Formatting runs before linting.
  - repo: local
    hooks:
      - id: cmake-format
        name: cmake-format
        entry: uv run --frozen --group tooling -- cmake-format --config-files .cmake-format.yaml
          --in-place
        language: system
        files: (CMakeLists\.txt|\.cmake)$

      - id: cmake-lint
        name: cmake-lint
        entry: uv run --frozen --group tooling -- cmake-lint --config-files .cmake-format.yaml
        language: system
        files: (CMakeLists\.txt|\.cmake)$

  # ------------------------------------------------------------------ Markdown
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: b82a6c8896e491b9cb377a99ff3412131920681b  # frozen: v0.23.2
    hooks:
      - id: markdownlint-cli2
        # Pinned so the hook does not depend on whatever Node the machine
        # happens to have; markdownlint-cli2 requires a recent one.
        language_version: '22.22.2'

  # ------------------------------------------------------------ GitHub Actions
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
        # actionlint's optional ShellCheck integration must be deterministic.
        # The managed hook environment supplies actionlint; the repository
        # tooling environment supplies the exact pinned shellcheck-py binary,
        # so embedded `run:` scripts are always analysed. Verified from an
        # ordinary `git commit` without an activated virtual environment.
        entry: uv run --frozen --group tooling -- actionlint
        language: system

  # ------------------------------------------------------------- Shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [--severity=style, --shell=bash]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 05c1426671b9237fb5e1444dd63aa5731bec0dfb  # frozen: v3.13.1-1
    hooks:
      - id: shfmt
        # Matches .editorconfig: 4-space indentation, LF, POSIX-safe bash.
        args: [--language-dialect, bash, --indent, '4', --case-indent, --write]

  # ------------------------------- Python maintenance scripts (no app runtime)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: e8f7d69b957a30acb2c875078d5fd012de24b64c  # frozen: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ------------------------------------------------------------------ Spelling
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        args: [--ignore-words, .codespell-ignore-words.txt]
        additional_dependencies: [tomli]

  # ------------------------------------------- Whitespace, data and integrity
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      # Whitespace: normalise to LF; Markdown uses explicit line breaks.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=none]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      # Structured data. Workflow semantics remain actionlint's job.
      - id: check-yaml
      - id: check-json
      - id: check-toml
      # Repository integrity.
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      # Script metadata.
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      # Narrow credential check, not comprehensive secret detection.
      - id: detect-private-key
      # Large additions: 1 MiB threshold, enforced on all files.
      - id: check-added-large-files
        args: [--maxkb=1024, --enforce-all]

  # ------------------------------------------------------- Tool lock integrity
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 4f783b6470be305483837130a5be2e21ed7ff52b  # frozen: 0.12.13
    hooks:
      - id: uv-lock
        args: [--check]

  # ------------------------------------------------- Manual, explicitly invoked
  # Not part of an ordinary commit: these need a configure/build tree.
  # Run with: uv run --frozen --group tooling pre-commit run --hook-stage manual <id>
  - repo: local
    hooks:
      - id: clang-tidy-preset
        name: clang-tidy through the CMake analysis preset
        entry: scripts/run-clang-tidy-preset.sh
        language: script
        pass_filenames: false
        stages: [manual]
        types_or: [c, c++]

      - id: pre-commit-validate-config
        name: pre-commit validate-config
        entry: uv run --frozen --group tooling -- pre-commit validate-config
        language: system
        pass_filenames: false
        stages: [manual]
        files: ^\.pre-commit-config\.yaml$
