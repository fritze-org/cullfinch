# SonarQube Cloud automatic analysis configuration.
#
# Automatic analysis reads the repository directly and has no compilation database, so it cannot
# learn the source/test split from CMake; it has to be stated here.
#
# Without sonar.tests, every file under tests/ is judged as production code. That is what produced
# roughly 180 findings demanding const-qualified Qt private test slots, pointer-to-const widget
# handles in assertions and in-class initialisers in throwaway fixtures — advice that is right for a
# library and wrong for a test body. Bug-class rules still apply to test code, which is the point.
#
# The two sets are listed explicitly rather than as "everything, minus tests": the source and test
# sets must be disjoint, indexing one file in both is an analysis error, and sonar.exclusions is not
# among the keys documented for this file. Directories are named, so anything added at the
# repository root is outside the analysed scope until it is listed here.
sonar.sources=src,.github,cmake,scripts,packaging,docs
sonar.tests=tests

# sonar.cfamily.reportingCppStandardOverride is deliberately unset. It defaults to the newest
# standard the analyser supports, which is what this project now targets (decision 0008); its
# documented value list stops at c++20, so naming our standard explicitly would be the riskier
# option. Set it if cullfinch ever targets an older standard than the analyser's newest.
